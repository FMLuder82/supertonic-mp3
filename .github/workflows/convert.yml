name: Convert chats to MP3

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: python -m pip install --upgrade pip && python -m pip install "supertonic==1.3.1"

      - name: Convert chats
        shell: bash
        run: |
          set -e

          mkdir -p wav Mp3

          shopt -s nullglob
          files=(Chats/*.txt)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No TXT files found in Chats/"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo
            echo "============================================================"
            echo "CHAT: $file"
            echo "============================================================"

            python txt_to_wav.py "$file" --output-dir wav

            name="$(basename "$file" .txt)"

            python wav_to_mp3.py \
              "wav/$name" \
              --output "Mp3/$name.mp3" \
              --bitrate 128k
          done

      - name: Upload MP3 files
        uses: actions/upload-artifact@v4
        with:
          name: mp3
          path: Mp3/*.mp3
          if-no-files-found: error
